name: Construcción y Subida a Docker Hub

# El pipeline se ejecutará automáticamente cada vez que hagas un "push" a la rama main
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: 110210/mi-microservicio:latest